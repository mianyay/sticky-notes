<!DOCTYPE html>
<html lang="en">
<head>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap');
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sticky-Notes</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="icon" type="image/ico" href="images/favicon.ico">
</head>
<body>
    <header class="tabBar">
        <h1>Sticky Notes</h1>

        <select name="categories" id="categories">
            <option value="ideas">Costume ideas</option>  
            <option value="journal">Journal Scary Stories</option>
            <option value="due">Due</option>
            <option value="goals">Candy Goals</option>
        </select>
        
        <button id="addBtn">+ New note</button>

        <select name="filter" id="filter">
            <option value="all">Show all</option>
            <option value="ideas">Costume ideas</option>
            <option value="due">Due</option>
            <option value="goals">Candy Goals</option>
            <option value="journal">Journal Scary Stories</option>
        </select>
        <div class="spider" style="left: 50px; --size: 60px; --min: 30px; --max: 170px; --dur: 6s">
            <span class="thread"></span>
            <img src="images/spider.png" alt="" draggable="false">
        </div>
        <div class="spider" style="left: 150px; --size: 45px; --min: 20px; --max: 100px; --dur: 4.5s; --delay: -2s">
            <span class="thread"></span>
            <img src="images/spider.png" alt="" draggable="false">
        </div>
    </header>
    <main id="board"></main>
    <script src="./script.js"></script>
</body>
</html>
